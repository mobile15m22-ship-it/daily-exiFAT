name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Wrapper & Build APK
      run: |
        # যদি রুট ডিরেক্টরিতে settings.gradle না থাকে, তবে সাবফোল্ডার খুঁজে নিয়ে সেখানে বিল্ড করবে
        BUILD_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
        if [ -n "$BUILD_DIR" ]; then
          cd "$BUILD_DIR"
        fi
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/app-debug.apk'
